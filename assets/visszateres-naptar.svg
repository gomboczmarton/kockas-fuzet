<text x="580" y="106" font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace" font-size="15" fill="#6B675E">← három üres kocka, egy kör alatt bepótolva</text>
<text x="24" y="184" font-family="Georgia,&#39;Times New Roman&#39;,serif" font-size="26" font-style="italic" fill="#3F6B52">„A győzelem az, hogy visszatértél.&#34;</text>
<text x="24" y="214" font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace" font-size="15" fill="#6B675E">az üres kocka szaggatott, nem piros — a hangnem-szabály grafikára fordítva</text>
